name: lab06-linear-regression

services:
  api:
    image: nazirahmed72/lab06-linear-regression:v1
    ports:
      - "5000:5000"
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
